#
# The full quality floor on every push and pull request: exactly what
# AGENTS.md demands before any commit, and what the pre-push hook runs
# locally. The toolchain version comes from rust-toolchain.toml.

name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build

      - name: Tests
        run: cargo test

      - name: Clippy, zero warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: Rustdoc, warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: Magic-number policy
        run: cargo run -q -p xtask -- check-magic-numbers
