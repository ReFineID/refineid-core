name: core-quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Core quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Reject anonymous protocol numbers
        run: cargo run --locked -p xtask -- check-magic-numbers

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test the workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint without warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
