[workspace]
resolver = "3"
members = [
    "crates/auth",
    "crates/pace",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Petri Koistinen"]
repository = "https://github.com/ReFineID/refineid-core"

[workspace.dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
rustc_lexer = "0.1"
serde = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
trybuild = "1"
walkdir = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
strip = "symbols"
