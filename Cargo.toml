[workspace]
resolver = "3"
members = [
    "crates/apdu",
    "crates/atr",
    "crates/auth",
    "crates/ber",
    "crates/digest",
    "crates/pace",
    "crates/pin-cache",
    "crates/pkcs15",
    "crates/remote",
    "crates/sign",
    "crates/x509",
    "tools/xtask",
]

[workspace.package]
version = "26.8.29"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
authors = ["Petri Koistinen"]
repository = "https://github.com/ReFineID/refineid-core"

[workspace.dependencies]
refineid-apdu = { path = "crates/apdu" }
refineid-auth = { path = "crates/auth" }
refineid-ber = { path = "crates/ber" }
refineid-digest = { path = "crates/digest" }
refineid-pkcs15 = { path = "crates/pkcs15" }
refineid-x509 = { path = "crates/x509" }
aes = "0.9"
cbc = "0.2"
cmac = "0.8"
crypto-bigint = { version = "0.7", features = ["alloc", "zeroize"] }
getrandom = "0.4"
hmac = "0.13"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.11"
subtle = "2"
rustc_lexer = "0.1"
serde = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
trybuild = "1"
walkdir = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
overflow-checks = true
panic = "abort"
strip = "symbols"
